<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mini Shop</title>
  <style>
    body{font-family:Arial;margin:0;background:#f5f5f5;color:#222}
    header{background:#111;color:white;padding:15px;text-align:center}
    .products{display:flex;gap:15px;flex-wrap:wrap;padding:20px;justify-content:center}
    .product{background:white;padding:15px;width:180px;border-radius:8px;text-align:center}
    .product img{width:100%;height:120px;object-fit:cover;border-radius:5px}
    button{background:#111;color:white;border:0;padding:8px 12px;border-radius:5px;cursor:pointer}
    #cart{background:white;margin:20px;padding:20px;border-radius:8px}
  </style>
</head>
<body>

<header>
  <h2>Mini Shop 🛒</h2>
</header>

<div class="products">
  <div class="product">
    <img src="https://via.placeholder.com/180" alt="Product">
    <h3>T-Shirt</h3>
    <p>₹499</p>
    <button onclick="addToCart('T-Shirt',499)">Add to Cart</button>
  </div>

  <div class="product">
    <img src="https://via.placeholder.com/180" alt="Product">
    <h3>Shoes</h3>
    <p>₹999</p>
    <button onclick="addToCart('Shoes',999)">Add to Cart</button>
  </div>
</div>

<div id="cart">
  <h2>Cart</h2>
  <div id="items">Cart is empty</div>
  <h3>Total: ₹<span id="total">0</span></h3>
  <button onclick="checkout()">Checkout</button>
</div>

<script>
  let cart = [];

  function addToCart(name, price) {
    cart.push({name, price});
    renderCart();
  }

  function renderCart() {
    let items = document.getElementById("items");
    let total = 0;

    if (!cart.length) {
      items.innerHTML = "Cart is empty";
    } else {
      items.innerHTML = cart.map((item, i) =>
        `<p>${item.name} - ₹${item.price}
        <button onclick="removeItem(${i})">Remove</button></p>`
      ).join("");

      total = cart.reduce((sum, item) => sum + item.price, 0);
    }

    document.getElementById("total").textContent = total;
  }

  function removeItem(index) {
    cart.splice(index, 1);
    renderCart();
  }

  function checkout() {
    if (!cart.length) return alert("Your cart is empty!");
    alert("Order placed successfully!");
    cart = [];
    renderCart();
  }
</script>

</body>
</html>
